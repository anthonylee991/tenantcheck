name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,browser]"
      - run: patchright install --with-deps chromium
      - run: pytest -q tests/test_browser.py tests/test_ui.py tests/test_network.py tests/test_browser_target.py tests/test_byoa.py tests/test_local.py tests/test_url_browser.py
