name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    env:
      # GH runners have no unprivileged user namespaces, so Chromium's sandbox
      # cannot start. This is the same switch a container deployment uses.
      TENANTCHECK_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,browser]"
      - run: patchright install --with-deps chromium
      - run: pytest -q
